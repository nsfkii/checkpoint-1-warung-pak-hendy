openapi: 3.1.0
info:
  title: Warung Pak Hendy Inventory API
  version: 1.0.0
  description: |
    Design-first HTTP contract for the Inventory Backend used by the POS.

    Business rules:
    - Product IDs are generated by the backend as UUIDs.
    - Product catalog and detail endpoints expose active products only.
      Archived products are soft-deleted, never physically deleted by this API.
    - Product creation requires a name, unit, non-negative selling price,
      non-negative integer opening stock, and non-negative integer minimum stock.
    - Product updates replace editable product information. Stock, ID, and
      archive timestamp are not client-editable through PUT.
    - Transactions accept product IDs and positive integer quantities only.
      The backend obtains prices from its database, snapshots product name,
      unit and unit price, and calculates subtotals and the transaction total.
    - A transaction and all stock changes are atomic. If an item is invalid,
      archived, or has insufficient stock, no item or stock change is committed.
    - Idempotency-Key is required. Repeating a key and identical request replays
      the stored success or deterministic business conflict (insufficient stock
      or archived product). A key with a different request returns 409 Conflict.
      Responses 400, 404 for an unknown transaction product, 422, and 500 are not
      stored as idempotency results; a retry with that key may be processed again.
    - All prices and monetary totals are non-negative integer IDR amounts with
      no fractional Rupiah. JSON uses integer values and PostgreSQL uses
      NUMERIC(15,0), with a maximum of 999999999999999. Decimal, negative, and
      over-capacity inputs are rejected; no implicit rounding is performed.

    The asynchronous StockMinimumReached event is not an HTTP operation. The
    event's exchange, routing key, queue, publisher, consumer and trigger are
    documented in TECHNICAL_DECISIONS.md. This API description does not duplicate
    the event payload schema.
servers:
  - url: http://localhost:8000
    description: Local development
tags:
  - name: Products
    description: Active product catalog and product maintenance.
  - name: Transactions
    description: Synchronous POS sales transactions.
paths:
  /api/v1/products:
    get:
      tags: [Products]
      operationId: listProducts
      summary: List active products
      description: |
        Returns active products only. Products with deleted_at set are excluded
        from the POS catalog. Pagination and catalog filters remain pending and
        are not part of this contract; this response is currently an unpaginated
        data array.
      responses:
        '200':
          $ref: '#/components/responses/ProductCollection'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Products]
      operationId: createProduct
      summary: Create a product
      description: |
        The backend generates the UUID. Clients cannot set id or deleted_at.
        Product fields such as SKU are omitted because SKU has not been decided.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
            examples:
              bottledWater:
                summary: Create an active bottled water product
                value:
                  name: Air Mineral 600 ml
                  unit: botol
                  sellingPrice: 3500
                  stockQuantity: 24
                  minimumStock: 6
      responses:
        '201':
          $ref: '#/components/responses/ProductCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationProblem'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/products/{productId}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      tags: [Products]
      operationId: getProduct
      summary: Get an active product
      description: Returns 404 when the UUID does not identify an active product.
      responses:
        '200':
          $ref: '#/components/responses/ProductResource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Products]
      operationId: replaceProduct
      summary: Replace editable product information
      description: |
        Replaces all editable fields. The product must be active. ID, stock,
        created_at, updated_at, and deleted_at cannot be set by the client.
        Stock changes are performed by sales or an explicitly audited inventory
        process, not by this catalog update operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
            examples:
              updateBottledWater:
                summary: Change product information and minimum stock
                value:
                  name: Air Mineral 600 ml
                  unit: botol
                  sellingPrice: 4000
                  minimumStock: 8
      responses:
        '200':
          $ref: '#/components/responses/ProductResource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '422':
          $ref: '#/components/responses/ValidationProblem'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Products]
      operationId: archiveProduct
      summary: Archive a product
      description: |
        Sets deleted_at on an active product and retains its database row and
        transaction history. A product can be archived even when transactions
        reference it. Archived products are absent from the POS catalog, cannot
        be used in new transactions, and remain available through historical
        transaction snapshots. Repeating DELETE for an archived or unknown
        product returns 404; DELETE does not physically remove product data.
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/transactions:
    post:
      tags: [Transactions]
      operationId: createTransaction
      summary: Record a sale and reduce stock
      description: |
        The backend looks up current product prices; price fields are not
        accepted in the request. For each item it snapshots product name, unit,
        unit price and quantity, calculates the item subtotal, and calculates
        the transaction total. The transaction, items, stock changes, and
        outbox event (when the minimum-stock threshold is crossed) are committed
        atomically. Any invalid, archived, or insufficient-stock item rolls
        back the entire transaction.

        Repeating an identical request with the same Idempotency-Key replays the
        stored response: either the successful 200 transaction or a stored 409
        business conflict for insufficient stock or an archived product.
        Reusing a committed key with a different request returns 409 Problem
        Details and does not replace the stored result. A 404 for an unknown
        product is not stored; the key is not permanently bound, and a retry may
        be processed again if product availability changes. Responses 400, 422,
        and 500 are also not stored. The key must be non-empty and at most 255
        characters. Its retention period is not specified by this contract.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransactionRequest'
            examples:
              twoBottles:
                summary: Sell two bottles of water
                value:
                  items:
                    - productId: b2e0b1f4-f8c1-4d9c-9ee1-44fdd3c88f01
                      quantity: 2
      responses:
        '200':
          $ref: '#/components/responses/TransactionSuccess'
        '400':
          $ref: '#/components/responses/TransactionBadRequest'
        '404':
          $ref: '#/components/responses/ReferencedProductNotFound'
        '409':
          $ref: '#/components/responses/TransactionConflict'
        '422':
          $ref: '#/components/responses/ValidationProblem'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  parameters:
    ProductId:
      name: productId
      in: path
      required: true
      description: UUID of the requested product.
      schema:
        $ref: '#/components/schemas/Uuid'
      example: b2e0b1f4-f8c1-4d9c-9ee1-44fdd3c88f01
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Opaque key identifying one logical POS transaction request. It must be
        non-empty and no longer than 255 characters. Do not reuse a key with a
        different request body. Retention remains pending.
      schema:
        type: string
        minLength: 1
        maxLength: 255
      example: pos-sale-20261101-000042

  responses:
    ProductCollection:
      description: Active product list. Archived products are excluded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProductCollection'
          examples:
            activeProducts:
              summary: Product catalog with active products only
              value:
                data:
                  - id: b2e0b1f4-f8c1-4d9c-9ee1-44fdd3c88f01
                    name: Air Mineral 600 ml
                    unit: botol
                    sellingPrice: 3500
                    stockQuantity: 24
                    minimumStock: 6
                    createdAt: '2026-11-01T08:30:00Z'
                    updatedAt: '2026-11-01T08:30:00Z'
    ProductResource:
      description: Active product resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProductResource'
          examples:
            bottledWater:
              summary: Active bottled water product
              value:
                data:
                  id: b2e0b1f4-f8c1-4d9c-9ee1-44fdd3c88f01
                  name: Air Mineral 600 ml
                  unit: botol
                  sellingPrice: 3500
                  stockQuantity: 24
                  minimumStock: 6
                  createdAt: '2026-11-01T08:30:00Z'
                  updatedAt: '2026-11-01T08:30:00Z'
    ProductCreated:
      description: Product created. The Location header identifies the new resource.
      headers:
        Location:
          description: URI of the created product.
          schema:
            type: string
            format: uri-reference
          example: /api/v1/products/b2e0b1f4-f8c1-4d9c-9ee1-44fdd3c88f01
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProductResource'
          examples:
            createdProduct:
              summary: Newly created active product
              value:
                data:
                  id: b2e0b1f4-f8c1-4d9c-9ee1-44fdd3c88f01
                  name: Air Mineral 600 ml
                  unit: botol
                  sellingPrice: 3500
                  stockQuantity: 24
                  minimumStock: 6
                  createdAt: '2026-11-01T08:30:00Z'
                  updatedAt: '2026-11-01T08:30:00Z'
    TransactionSuccess:
      description: Transaction recorded and stock reduced atomically.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TransactionResource'
          examples:
            saleRecorded:
              summary: Two-unit sale with server-sourced price snapshots
              value:
                data:
                  id: c2eafc53-3f5e-41e0-9a15-479a6cda73cc
                  transactionAt: '2026-11-01T08:32:00Z'
                  createdAt: '2026-11-01T08:32:00Z'
                  updatedAt: '2026-11-01T08:32:00Z'
                  items:
                    - productId: b2e0b1f4-f8c1-4d9c-9ee1-44fdd3c88f01
                      productName: Air Mineral 600 ml
                      unit: botol
                      quantity: 2
                      unitPrice: 3500
                      subtotal: 7000
                  totalAmount: 7000
    NoContent:
      description: Product archived. No response body is returned.
    BadRequest:
      description: Malformed JSON request body.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            malformedJson:
              summary: Request body is not valid JSON
              value:
                type: https://warung-pak-hendy.example/problems/bad-request
                title: Bad Request
                status: 400
                detail: The request could not be understood.
                instance: /api/v1/products
    TransactionBadRequest:
      description: Malformed JSON or missing, empty, or overlong Idempotency-Key.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            missingIdempotencyKey:
              summary: Required transaction header is missing
              value:
                type: https://warung-pak-hendy.example/problems/missing-header
                title: Bad Request
                status: 400
                detail: Idempotency-Key header is required.
                instance: /api/v1/transactions
            invalidIdempotencyKey:
              summary: Idempotency-Key is empty or longer than 255 characters
              value:
                type: https://warung-pak-hendy.example/problems/invalid-header
                title: Bad Request
                status: 400
                detail: Idempotency-Key must contain between 1 and 255 characters.
                instance: /api/v1/transactions
    ProductNotFound:
      description: Product UUID is invalid, does not exist, or identifies an archived product.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://warung-pak-hendy.example/problems/not-found
            title: Resource not found
            status: 404
            detail: The requested resource could not be found.
            instance: /api/v1/products/not-a-uuid
    ReferencedProductNotFound:
      description: A productId in the transaction request does not identify a product. This 404 is not stored as an idempotency result; the same key may be retried if product availability changes.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://warung-pak-hendy.example/problems/product-not-found
            title: Product not found
            status: 404
            detail: One or more productId values do not identify a product.
            instance: /api/v1/transactions
    TransactionConflict:
      description: Insufficient-stock and archived-product 409 responses are stored with the key and request hash for identical-request replay. A 409 caused by reusing a committed key with a different body does not replace the stored result.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            insufficientStock:
              summary: Requested quantity exceeds current stock
              value:
                type: https://warung-pak-hendy.example/problems/insufficient-stock
                title: Insufficient stock
                status: 409
                detail: One or more products do not have enough stock for this transaction.
                instance: /api/v1/transactions
            archivedProduct:
              summary: Archived products cannot be sold
              value:
                type: https://warung-pak-hendy.example/problems/product-archived
                title: Product unavailable
                status: 409
                detail: An archived product cannot be used in a new transaction.
                instance: /api/v1/transactions
            idempotencyConflict:
              summary: Key was already used with a different request body
              value:
                type: https://warung-pak-hendy.example/problems/idempotency-key-conflict
                title: Idempotency key conflict
                status: 409
                detail: This Idempotency-Key was already used with a different request body.
                instance: /api/v1/transactions
    ValidationProblem:
      description: JSON is syntactically valid but one or more fields fail validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            invalidProduct:
              summary: Required product field is empty
              value:
                type: https://warung-pak-hendy.example/problems/validation-error
                title: Validation failed
                status: 422
                detail: One or more fields do not satisfy the request constraints.
                instance: /api/v1/products
                errors:
                  - pointer: /name
                    code: invalid_value
                    detail: The name field is required.
            unknownProductField:
              summary: Request includes a property not defined by the schema
              value:
                type: https://warung-pak-hendy.example/problems/validation-error
                title: Validation failed
                status: 422
                detail: One or more fields do not satisfy the request constraints.
                instance: /api/v1/products
                errors:
                  - pointer: /unexpectedField
                    code: invalid_value
                    detail: The unexpectedField field is prohibited.
            invalidQuantity:
              summary: Quantity is outside the supported positive integer range
              value:
                type: https://warung-pak-hendy.example/problems/validation-error
                title: Validation failed
                status: 422
                detail: One or more fields do not satisfy the request constraints.
                instance: /api/v1/transactions
                errors:
                  - pointer: /items/0/quantity
                    code: positive_integer_required
                    detail: quantity must be an integer between 1 and 2147483647.
            duplicateProductId:
              summary: The same productId occurs more than once in transaction items
              value:
                type: https://warung-pak-hendy.example/problems/validation-error
                title: Validation failed
                status: 422
                detail: One or more fields do not satisfy the request constraints.
                instance: /api/v1/transactions
                errors:
                  - pointer: /items/1/productId
                    code: duplicate_product_id
                    detail: Each productId may appear only once in a transaction.
            amountLimitExceeded:
              summary: Item subtotal or transaction total exceeds NUMERIC(15,0)
              value:
                type: https://warung-pak-hendy.example/problems/validation-error
                title: Validation failed
                status: 422
                detail: One or more fields do not satisfy the request constraints.
                instance: /api/v1/transactions
                errors:
                  - pointer: /items/0/quantity
                    code: amount_limit_exceeded
                    detail: The item subtotal exceeds the maximum supported Rupiah amount.
    InternalServerError:
      description: Unexpected server failure. Internal implementation details are not exposed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://warung-pak-hendy.example/problems/internal-error
            title: Internal Server Error
            status: 500
            detail: An unexpected error occurred.
            instance: /api/v1/products

  schemas:
    Uuid:
      type: string
      format: uuid
      description: RFC 4122 UUID string.
      examples:
        - b2e0b1f4-f8c1-4d9c-9ee1-44fdd3c88f01
    ProductName:
      type: string
      minLength: 1
      maxLength: 160
      pattern: '.*\S.*'
      description: Product name or transaction snapshot. Must contain a non-whitespace character and maps to VARCHAR(160).
    ProductUnit:
      type: string
      minLength: 1
      maxLength: 32
      pattern: '.*\S.*'
      description: Product unit or transaction snapshot. Must contain a non-whitespace character and maps to VARCHAR(32).
    RupiahAmount:
      type: integer
      minimum: 0
      maximum: 999999999999999
      description: Whole Rupiah amount (IDR), with no fractional Rupiah. Maps to PostgreSQL NUMERIC(15,0). Decimal, negative, and over-capacity values are rejected; no rounding is performed.
      examples: [500, 5000, 12000, 25000]
    Product:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - unit
        - sellingPrice
        - stockQuantity
        - minimumStock
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          $ref: '#/components/schemas/ProductName'
        unit:
          $ref: '#/components/schemas/ProductUnit'
        sellingPrice:
          $ref: '#/components/schemas/RupiahAmount'
          description: Product selling price in whole IDR; maps to products.selling_price NUMERIC(15,0).
        stockQuantity:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Maps to products.stock_quantity; not editable through PUT.
          examples: [24]
        minimumStock:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Minimum stock threshold; maps to products.minimum_stock.
          examples: [6]
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
    CreateProductRequest:
      type: object
      additionalProperties: false
      required: [name, unit, sellingPrice, stockQuantity, minimumStock]
      properties:
        name:
          $ref: '#/components/schemas/ProductName'
        unit:
          $ref: '#/components/schemas/ProductUnit'
        sellingPrice:
          $ref: '#/components/schemas/RupiahAmount'
          description: Product selling price in whole IDR; maps to products.selling_price NUMERIC(15,0).
        stockQuantity:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Opening stock; maps to products.stock_quantity. Subsequent stock changes are not made through product updates.
          examples: [24]
        minimumStock:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Minimum stock threshold; maps to products.minimum_stock.
          examples: [6]
    UpdateProductRequest:
      type: object
      additionalProperties: false
      required: [name, unit, sellingPrice, minimumStock]
      properties:
        name:
          $ref: '#/components/schemas/ProductName'
        unit:
          $ref: '#/components/schemas/ProductUnit'
        sellingPrice:
          $ref: '#/components/schemas/RupiahAmount'
          description: Product selling price in whole IDR; maps to products.selling_price NUMERIC(15,0).
        minimumStock:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Minimum stock threshold; maps to products.minimum_stock.
          examples: [8]
    ProductResource:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Product'
    ProductCollection:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Product'
    CreateTransactionRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          description: Each productId may occur only once. Duplicate productIds are rejected with 422 Problem Details before any transaction or stock change is stored.
          items:
            $ref: '#/components/schemas/TransactionItemRequest'
    TransactionItemRequest:
      type: object
      additionalProperties: false
      required: [productId, quantity]
      properties:
        productId:
          $ref: '#/components/schemas/Uuid'
        quantity:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: Positive whole units within the PostgreSQL INTEGER range.
          examples: [2]
    TransactionItem:
      type: object
      additionalProperties: false
      required: [productId, productName, unit, quantity, unitPrice, subtotal]
      properties:
        productId:
          $ref: '#/components/schemas/Uuid'
        productName:
          $ref: '#/components/schemas/ProductName'
          readOnly: true
          description: Product name snapshot at sale time; maps to transaction_items.product_name_snapshot.
        unit:
          $ref: '#/components/schemas/ProductUnit'
          readOnly: true
          description: Unit snapshot at sale time; maps to transaction_items.unit_snapshot.
          examples: [botol]
        quantity:
          type: integer
          minimum: 1
          readOnly: true
        unitPrice:
          allOf:
            - $ref: '#/components/schemas/RupiahAmount'
          readOnly: true
          description: Backend-sourced whole-IDR price snapshot; maps to transaction_items.unit_price_snapshot NUMERIC(15,0).
        subtotal:
          allOf:
            - $ref: '#/components/schemas/RupiahAmount'
          readOnly: true
          description: Integer multiplication of quantity by unitPrice, with no rounding; maps to transaction_items.subtotal NUMERIC(15,0). Values exceeding column capacity are rejected.
    TransactionResource:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Transaction'
    Transaction:
      type: object
      additionalProperties: false
      required: [id, transactionAt, createdAt, updatedAt, items, totalAmount]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        transactionAt:
          type: string
          format: date-time
          readOnly: true
          description: Maps to transactions.transaction_at.
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: Maps to transactions.created_at.
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          description: Maps to transactions.updated_at.
        items:
          type: array
          minItems: 1
          readOnly: true
          items:
            $ref: '#/components/schemas/TransactionItem'
        totalAmount:
          allOf:
            - $ref: '#/components/schemas/RupiahAmount'
          readOnly: true
          description: Integer sum of item subtotals in whole IDR, with no rounding; maps to transactions.total_amount NUMERIC(15,0). Values exceeding column capacity are rejected.
    ValidationError:
      type: object
      additionalProperties: false
      required: [pointer, code, detail]
      properties:
        pointer:
          type: string
          description: JSON Pointer to the invalid request value.
          examples: [/items/0/quantity]
        code:
          type: string
          examples: [positive_integer_required]
        detail:
          type: string
          examples: [quantity must be an integer between 1 and 2147483647.]
    ProblemDetails:
      type: object
      description: RFC 9457 Problem Details with an optional validation errors extension.
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: Must equal the actual HTTP response status.
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
      examples:
        - type: https://warung-pak-hendy.example/problems/validation-error
          title: Validation failed
          status: 422
          detail: One or more fields do not satisfy the request constraints.
          instance: /api/v1/transactions
          errors:
            - pointer: /items/0/quantity
              code: positive_integer_required
              detail: quantity must be an integer between 1 and 2147483647.
